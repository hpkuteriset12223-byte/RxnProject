<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0f172a; --blue:#3b82f6; --bg:#eef4ff; --card:#ffffff; --yellow:#facc15; --red:#ef4444; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { min-height:100%; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));
    background:var(--bg); font-family:'Roboto Condensed',Arial,sans-serif; color:var(--ink);
  }
  .wrap { width:100%; max-width:420px; }

  .brand { display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; }
  .logo {
    width:84px; height:84px; display:flex; align-items:center; justify-content:center;
    background:var(--blue); border:3px solid var(--ink); border-radius:24px; box-shadow:5px 5px 0 var(--ink);
  }
  .logo svg { width:42px; height:42px; stroke:#fff; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .brand h1 { font-size:34px; font-weight:900; letter-spacing:2px; text-transform:uppercase; }
  .brand p { font-size:16px; font-weight:700; color:#475569; }

  .card {
    margin-top:26px; padding:20px;
    background:var(--card); border:3px solid var(--ink); border-radius:18px; box-shadow:5px 5px 0 var(--ink);
  }
  .field + .field { margin-top:16px; }
  .field label { display:block; margin-bottom:6px; font-size:13px; font-weight:900; letter-spacing:1.5px; text-transform:uppercase; color:#475569; }
  .input {
    display:flex; align-items:center; gap:10px; height:58px; padding:0 8px 0 14px;
    background:var(--bg); border:3px solid var(--ink); border-radius:14px; box-shadow:3px 3px 0 var(--ink);
    transition:box-shadow .12s, transform .12s, background .15s;
  }
  .input:focus-within { background:#fff; transform:translate(1px,1px); box-shadow:2px 2px 0 var(--blue); border-color:var(--ink); }
  .input > svg { width:22px; height:22px; flex:none; stroke:var(--blue); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .input input {
    flex:1; min-width:0; height:100%; border:none; outline:none; background:transparent;
    font-family:inherit; font-size:18px; font-weight:700; letter-spacing:.5px; color:var(--ink);
  }
  .input input::placeholder { color:#94a3b8; font-weight:700; }
  .eye {
    width:38px; height:38px; flex:none; padding:0; display:flex; align-items:center; justify-content:center;
    background:var(--blue); border:3px solid var(--ink); border-radius:10px; box-shadow:2px 2px 0 var(--ink);
    cursor:pointer; outline:none; transition:transform .08s, box-shadow .08s;
  }
  .eye:active { transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }
  .eye:focus-visible, .btn:focus-visible { outline:3px solid var(--yellow); outline-offset:2px; }
  .eye svg { width:20px; height:20px; stroke:#fff; fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
  .eye .off { display:none; }
  .eye.show .on { display:none; }
  .eye.show .off { display:block; }

  .field.error .input { border-color:var(--red); box-shadow:3px 3px 0 var(--red); }
  .msg { display:none; margin-top:14px; padding:10px 12px; font-size:15px; font-weight:700; color:#fff; background:var(--red); border:3px solid var(--ink); border-radius:12px; box-shadow:3px 3px 0 var(--ink); }
  .msg.show { display:block; }
  .msg.ok { background:#22c55e; color:var(--ink); }

  .btn {
    width:100%; height:60px; margin-top:20px; display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--blue); color:#fff; border:3px solid var(--ink); border-radius:14px; box-shadow:5px 5px 0 var(--ink);
    font-family:inherit; font-size:20px; font-weight:900; letter-spacing:2px; text-transform:uppercase;
    cursor:pointer; outline:none; transition:transform .08s, box-shadow .08s;
  }
  .btn:active { transform:translate(5px,5px); box-shadow:0 0 0 var(--ink); }
  .btn[disabled] { opacity:.8; pointer-events:none; }
  .btn .spin { display:none; width:22px; height:22px; border:4px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
  .btn.loading .spin { display:block; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .foot { margin-top:22px; text-align:center; font-size:15px; font-weight:700; color:#475569; }
  .foot a { color:var(--blue); font-weight:900; text-decoration:none; }
  .shake { animation:shake .35s; }
  @keyframes shake { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .shake, .btn .spin { animation:none; } .input, .eye, .btn { transition:none; } }
</style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><path d="M12 15.5v2"/></svg></div>
      <h1>RXN PROJECT</h1>
      <p>Masuk untuk lanjut ke dashboard</p>
    </div>

    <form class="card" id="form" novalidate>
      <div class="field" id="fUser">
        <label for="username">Username</label>
        <div class="input">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
          <input id="username" type="text" placeholder="Masukkan username" autocomplete="username" autocapitalize="none" spellcheck="false">
        </div>
      </div>
      <div class="field" id="fPass">
        <label for="password">Password</label>
        <div class="input">
          <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="password" type="password" placeholder="Masukkan password" autocomplete="current-password">
          <button class="eye" id="eye" type="button" aria-label="Tampilkan password">
            <svg class="on" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
      </div>

      <div class="msg" id="msg" role="alert"></div>

      <button class="btn" id="submit" type="submit"><span class="spin"></span><span id="btnText">Login</span></button>
    </form>

    <p class="foot">Belum punya akun? <a href="#">Daftar</a></p>
  </main>

<script>
  const API = 'http://104.64.216.193:3000';

  const form = document.getElementById('form');
  const user = document.getElementById('username');
  const pass = document.getElementById('password');
  const fUser = document.getElementById('fUser');
  const fPass = document.getElementById('fPass');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit');
  const btnText = document.getElementById('btnText');
  const eye = document.getElementById('eye');

  /* ===== Auto login via session ===== */
  (function () {
    const s = localStorage.getItem('session');
    if (!s) return;
    fetch(API + '/api/login/' + encodeURIComponent(s), { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.success) {
          localStorage.setItem('username', d.username);
          localStorage.setItem('role', (d.user && d.user.role) || 'member');
          localStorage.setItem('userid', (d.user && d.user.id) || '');
          window.location.replace('dashboard.html');
        } else {
          localStorage.removeItem('session');
          localStorage.removeItem('username');
          localStorage.removeItem('role');
          localStorage.removeItem('userid');
        }
      })
      .catch(function () { /* server mati: tetap di login */ });
  })();

  eye.addEventListener('click', function () {
    const show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    eye.classList.toggle('show', show);
    eye.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
  });

  function showMsg(text, ok) {
    msg.textContent = text;
    msg.classList.toggle('ok', !!ok);
    msg.classList.add('show');
  }

  function fail(text) {
    showMsg(text, false);
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
  }

  function setLoading(on) {
    btn.disabled = on;
    btn.classList.toggle('loading', on);
    btnText.textContent = on ? 'Memproses' : 'Login';
  }

  [user, pass].forEach(function (el) {
    el.addEventListener('input', function () {
      fUser.classList.remove('error'); fPass.classList.remove('error'); msg.classList.remove('show');
    });
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const u = user.value.trim();
    const p = pass.value;

    fUser.classList.toggle('error', !u);
    fPass.classList.toggle('error', !p);
    if (!u || !p) return fail('Username dan password wajib diisi.');

    setLoading(true);
    try {
      const res = await fetch(
        API + '/api/login/' + encodeURIComponent(u) + '/' + encodeURIComponent(p),
        { method: 'POST' }
      );
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('session', data.session);
        localStorage.setItem('username', (data.user && data.user.username) || u);
        localStorage.setItem('role', (data.user && data.user.role) || 'member');
        localStorage.setItem('userid', (data.user && data.user.id) || '');
        showMsg('Login berhasil!', true);
        setTimeout(function () { window.location.replace('dashboard.html'); }, 600);
      } else {
        fail(data.message || 'Login gagal');
      }
    } catch (err) {
      fail('Tidak bisa terhubung ke server.');
    }
    setLoading(false);
  });
</script>
</body>
</html>
